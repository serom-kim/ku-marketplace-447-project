{% extends "base.html" %}
{% block content %}
<h1>My Listings</h1>

<div class="grid">
{% for l in listings %}
    <div class="card">
        {% if l.ImageURL %}
            <img class="listing-img" src="{{ l.ImageURL }}" alt="{{ l.Title }}">
        {% endif %}
        <h3>{{ l.Title }}</h3>
        <p>${{ "%.2f"|format(l.Price) }}</p>
        <p>{{ l.CategoryName }} • <span class="badge">{{ l.Status }}</span></p>
        <div class="actions">
            <a class="btn" href="{{ url_for('listing_detail', listing_id=l.ListingID) }}">View</a>
            <a class="btn btn-secondary" href="{{ url_for('edit_listing', listing_id=l.ListingID) }}">Edit</a>
        </div>
    </div>
{% else %}
    <p>You have not created any listings.</p>
{% endfor %}
</div>
{% endblock %}
